[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conventional-git"
version = "0.2.0"
description = "Conventional Commits and Conventional Branch enforcement, validation, and generation"
readme = "README.md"
license = "MIT"
authors = [{ name = "G.A.JAGUAR", email = "dev@gajaguar.com" }]
keywords = [
  "cli",
  "conventional-branch",
  "conventional-commits",
  "git",
  "mcp-server",
  "pre-commit-hook",
  "python",
  "validation",
]
requires-python = ">=3.14"
dependencies = ["typer>=0.27"]

[project.optional-dependencies]
gitlint = ["gitlint>=0.19"]
llm = ["keyring>=25.7", "typesafe-sdk>=0.7"]
mcp = ["mcp>=1.30,<2"]

[project.urls]
Repository = "https://github.com/gajaguar/conventional-git"
Issues = "https://github.com/gajaguar/conventional-git/issues"

[project.scripts]
conventional-git = "conventional_git.cli.app:main"
conventional-git-mcp = "conventional_git.mcp.server:run"

[dependency-groups]
dev = [
  "conventional-git[gitlint,llm,mcp]",
  "mypy>=2.3.1",
  "pylint-plugin",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "ruff>=0.16.8",
]

[tool.uv.sources]
pylint-plugin = { git = "https://github.com/gajaguar/pylint-plugin" }

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
lint.per-file-ignores."tests/**/*.py" = [
  "assert",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
lint.per-file-ignores."src/conventional_git/cli/*.py" = [
  "boolean-default-value-positional-argument",
  "too-many-arguments",
  "too-many-positional-arguments",
]
lint.per-file-ignores."src/conventional_git/{adapters,generation}/*.py" = ["no-self-use"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["gitlint.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["checkers"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "app-frozenset-constant",
  "app-module-const-naming",
  "app-no-docstrings",
  "app-no-file-level-disable",
  "app-no-inline-imports",
  "app-no-relative-imports",
  "app-require-final",
  "app-test-aaa-markers",
  "app-test-name-implementation-detail",
  "app-test-no-blank-lines",
  "app-test-no-extra-comments",
  "app-test-partial-assertion",
  "app-unused-arg-use-del",
  "app-use-contextlib-suppress",
]
