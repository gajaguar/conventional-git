[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conventional-git"
version = "2.1.0"
description = "Conventional Commits and Conventional Branch enforcement, validation, and generation"
readme = "README.md"
license = "MIT"
authors = [{ name = "G.A.JAGUAR", email = "dev@gajaguar.com" }]
keywords = [
  "cli",
  "conventional-branch",
  "conventional-commits",
  "git",
  "mcp-server",
  "pre-commit-hook",
  "python",
  "validation",
]
requires-python = ">=3.14"
dependencies = ["typer>=0.27"]

[project.optional-dependencies]
gitlint = ["gitlint>=0.19"]
llm = ["keyring>=25.7", "typesafe-sdk>=0.7"]
mcp = ["mcp>=2.2,<3"]

[project.urls]
Repository = "https://github.com/gajaguar/conventional-git"
Issues = "https://github.com/gajaguar/conventional-git/issues"

[project.scripts]
conventional-git = "conventional_git.cli.app:main"
conventional-git-mcp = "conventional_git.mcp.server:run"

[dependency-groups]
dev = [
  "conventional-git[gitlint,llm,mcp]",
  "mypy>=2.3.1",
  "pylint-gajaguar>=2.0.1",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "ruff>=0.16.8",
  "skills-ref>=0.1.1",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 119
extend-exclude = ["tools"]
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
lint.per-file-ignores."tests/**/*.py" = [
  "assert",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
lint.per-file-ignores."src/conventional_git/cli/*.py" = [
  "boolean-default-value-positional-argument",
  "too-many-arguments",
  "too-many-positional-arguments",
]
lint.per-file-ignores."src/conventional_git/{adapters,generation}/*.py" = ["no-self-use"]

[tool.mypy]
strict = true
exclude = ["tests/", "tools/"]

[[tool.mypy.overrides]]
module = ["gitlint.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]
