[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conventional-git"
version = "0.1.0"
description = "Conventional Commits and Conventional Branch enforcement, validation, and generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "G.A.JAGUAR", email = "dev@gajaguar.com" }]
keywords = [
  "cli",
  "conventional-branch",
  "conventional-commits",
  "git",
  "mcp-server",
  "pre-commit-hook",
  "python",
  "validation",
]
requires-python = ">=3.14"
dependencies = [
  "mcp>=1.0,<2.0",
  "typer>=0.15",
]

[project.optional-dependencies]
gitlint = ["gitlint>=0.19"]
llm = ["keyring>=25", "typesafe-sdk>=0.7"]

[project.urls]
Repository = "https://github.com/gajaguar/conventional-git"
Issues = "https://github.com/gajaguar/conventional-git/issues"

[project.scripts]
conventional-git = "conventional_git.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conventional_git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/conventional_git"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = [
  "CPY",
  "D",
  "missing-trailing-comma",
  "shebang-missing-executable-file",
]
lint.isort.force-single-line = true
lint.isort.case-sensitive = true
lint.per-file-ignores."tests/**/*.py" = [
  "ANN",
  "ARG",
  "assert",
  "magic-value-comparison",
  "private-member-access",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
lint.per-file-ignores."src/conventional_git/cli/*.py" = [
  "FBT002",
  "PLR0913",
  "PLR0917",
]
lint.per-file-ignores."src/conventional_git/adapters/*.py" = [
  "ANN401",
  "no-self-use",
]
lint.per-file-ignores."src/conventional_git/generation/*.py" = [
  "no-self-use",
]

[tool.mypy]
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["gitlint.*"]
ignore_missing_imports = true

[tool.pylint.main]
load-plugins = ["checkers"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "app-no-docstrings",
  "app-no-file-level-disable",
  "app-no-inline-imports",
  "app-no-relative-imports",
  "app-test-aaa-markers",
  "app-test-no-blank-lines",
  "app-test-no-extra-comments",
  "app-unused-arg-use-del",
  "app-use-contextlib-suppress",
]

[tool.pyright]
include = ["src"]

[dependency-groups]
dev = [
  "gitlint>=0.19",
  "keyring>=25",
  "mypy>=2.1.0",
  "pylint-plugin>=1.1.2",
  "pylint>=4.0.5",
  "pyright>=1.1.409",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.15.15",
  "typesafe-sdk>=0.7",
]

[tool.uv.sources]
pylint-plugin = { git = "https://github.com/gajaguar/pylint-plugin" }
